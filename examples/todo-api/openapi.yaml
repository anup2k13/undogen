openapi: 3.0.3
info:
  title: Todo API (demo)
  version: 1.0.0
  description: |
    A small API with two realistic, deliberately planted reversibility bugs:
    1. DELETE /todos/{todoId} silently cascades to the todo's comments.
    2. POST /todos/{todoId}/archive also marks the todo done, and unarchive doesn't reset it.
paths:
  /todos:
    get:
      operationId: listTodos
      responses:
        '200':
          description: All todos
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Todo' } }
    post:
      operationId: createTodo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TodoInput' }
            example: { title: Write the README, done: false }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Todo' }
  /todos/{todoId}:
    parameters:
      - { name: todoId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getTodo
      responses:
        '200':
          description: A todo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Todo' }
    put:
      operationId: replaceTodo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TodoInput' }
      responses:
        '200':
          description: Replaced
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Todo' }
    patch:
      operationId: updateTodo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                done: { type: boolean }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Todo' }
    delete:
      operationId: deleteTodo
      responses:
        '204': { description: Deleted }
  /todos/{todoId}/archive:
    parameters:
      - { name: todoId, in: path, required: true, schema: { type: string } }
    post:
      operationId: archiveTodo
      responses:
        '200':
          description: Archived
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Todo' }
  /todos/{todoId}/unarchive:
    parameters:
      - { name: todoId, in: path, required: true, schema: { type: string } }
    post:
      operationId: unarchiveTodo
      responses:
        '200':
          description: Unarchived
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Todo' }
  /todos/{todoId}/send-reminder:
    parameters:
      - { name: todoId, in: path, required: true, schema: { type: string } }
    post:
      operationId: sendReminder
      summary: Email the owner a reminder
      responses:
        '202': { description: Reminder queued }
  /todos/{todoId}/comments:
    parameters:
      - { name: todoId, in: path, required: true, schema: { type: string } }
    get:
      operationId: listComments
      responses:
        '200':
          description: Comments
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Comment' } }
    post:
      operationId: createComment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, example: Looks good to me }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
  /todos/{todoId}/comments/{commentId}:
    parameters:
      - { name: todoId, in: path, required: true, schema: { type: string } }
      - { name: commentId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getComment
      responses:
        '200':
          description: A comment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
    delete:
      operationId: deleteComment
      responses:
        '204': { description: Deleted }
components:
  schemas:
    TodoInput:
      type: object
      required: [title]
      properties:
        title: { type: string }
        done: { type: boolean }
    Todo:
      type: object
      properties:
        id: { type: string, readOnly: true }
        title: { type: string }
        done: { type: boolean }
        archived: { type: boolean, readOnly: true }
        createdAt: { type: string, format: date-time, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }
    Comment:
      type: object
      properties:
        id: { type: string, readOnly: true }
        todoId: { type: string, readOnly: true }
        text: { type: string }
        createdAt: { type: string, format: date-time, readOnly: true }
