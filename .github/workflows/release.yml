name: Release

# Push a tag like v0.2.0 (matching package.json and python/pyproject.toml) to publish.
on:
  push:
    tags: ['v*']

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      - run: npm test
      - run: bash scripts/release-check.sh
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Tag matches pyproject.toml
        run: test "v$(python -c 'import tomllib;print(tomllib.load(open("python/pyproject.toml","rb"))["project"]["version"])')" = "${GITHUB_REF_NAME}"
      - run: pip install build && python -m build python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
