name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run demo

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: npm ci
      - run: pip install -e "python[test]"
      - name: Adapters (newest Python only)
        if: matrix.python == '3.13'
        run: pip install langchain-core openai-agents
      - run: pytest -q python

  action:
    # Runs this repository's GitHub Action against the demo API, which has two planted bugs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start the demo API
        run: |
          npx tsx examples/todo-api/server.ts 4010 &
          npx --yes wait-on@8.0.1 tcp:127.0.0.1:4010
      - id: undogen
        uses: ./
        continue-on-error: true
        with:
          spec: examples/todo-api/openapi.yaml
          base-url: http://127.0.0.1:4010
          fixtures: examples/todo-api/fixtures.json
      - name: The planted bugs are caught
        run: |
          test "${{ steps.undogen.outcome }}" = "failure"
          test "${{ steps.undogen.outputs.verified }}" = "6"
          test "${{ steps.undogen.outputs.failed }}" = "2"
          test -s "${{ steps.undogen.outputs.sarif-file }}"
